<!DOCTYPE html>
<html>
<head>
    <title>{{ product.name }}</title>
</head>
<body>

<h1>{{ product.name }}</h1>

<img src="{{ product.image }}" width="300">

<h3>Price: ₹{{ product.price }}</h3>

<p>{{ product.description }}</p>

<a href="{% url 'add_to_cart' product.id %}">
    <button>Add to Cart</button>
</a>

<br><br>

<a href="{% url 'home' %}">Back to Home</a>

</body>
</html>
