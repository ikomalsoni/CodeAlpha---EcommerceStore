<!DOCTYPE html>
<html>
<head>
    <title>Products</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

        <nav class="navbar navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="#">CodeAlpha E-Commerce</a>
        
                <form class="d-flex" method="GET">
                    <input class="form-control me-2" type="search"  name='q' placeholder="Search Product">
                    <button class="btn btn-success" type="submit">Search</button>
                </form>
            </div>
        </nav>
        

<div class="container mt-5">
    <h1 class="text-center mb-4">CodeAlpha E-Commerce</h1>

    <div class="row">

        {% for product in products %}

        <div class="col-md-4">
            <div class="card mb-4 shadow">

                
                <a href="{% url 'product_detail' product.id %}">
                    <img src="{{ product.image }}"
                    class="card-img-top" height="250">
                </a>

                <div class="card-body">
                    <h4>
                        <a href="{% url 'product_detail' product.id %}"></a>
                        {{ product.name }}
                    </a>
                    </h4>
                    <h5>₹{{ product.price }}</h5>
                    <p>{{ product.description }}</p>

                    <a href="{% url 'add_to_cart' product.id %}"class="btn btn-primary">
                        Add to Cart
                    </a>
                    

                </div>

            </div>
        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
